<script type="text/html" id="templates/settings/forge.html">
  <div class="settings-section settings-section-forge">
    <div class="settings-title">AI Forge</div>
    <div class="forge-status">Checking Forge connection…</div>

    <div class="forge-tabs">
      <button type="button" class="forge-tab selected" data-forge-tab="create">Create</button>
      <button type="button" class="forge-tab" data-forge-tab="refine">Refine</button>
      <button type="button" class="forge-tab" data-forge-tab="pixelize">Pixelize</button>
      <button type="button" class="forge-tab" data-forge-tab="library">Assets</button>
    </div>

    <!-- CREATE -->
    <div class="settings-item forge-pane" data-forge-pane="create">
      <div class="forge-mode-row">
        <label for="forge-mode">Create with</label>
        <select class="forge-mode" id="forge-mode">
          <option value="prepare" selected>GPT + free pixel fixer (recommended)</option>
          <option value="competition">Competing drafts</option>
        </select>
      </div>
      <div class="forge-prepare-help">
        <p class="forge-help">GPT paints a reference, then the free pixel fixer cleans it up. Forge checks the result and shows a review sheet for you to judge at 1× and 2×. QA checks are not artistic approval.</p>
        <p class="forge-help">Uses your existing GPT allowance. The pixel fixer is free.</p>
      </div>
      <textarea class="textfield forge-prompt" rows="4" maxlength="2000"
        placeholder="Describe the sprite, e.g. a battered cream 1994 mall payphone with a frayed handset cord, 3/4 top-down view"></textarea>
      <div class="forge-row">
        <label>Size</label>
        <input type="number" class="textfield forge-w" min="16" max="512" value="32"/>
        <span>×</span>
        <input type="number" class="textfield forge-h" min="16" max="512" value="32"/>
        <button type="button" class="button forge-use-canvas-size" title="Use current canvas size">canvas</button>
      </div>
      <div class="forge-prepare-checks">
        <label class="forge-checks-label" for="forge-checks">Visible checks (one per line, up to 8)</label>
        <textarea class="textfield forge-checks" id="forge-checks" rows="3">Readable at game size
Clean dark outline
No stray speckles</textarea>
      </div>
      <div class="forge-row forge-competition-options">
        <label>Style</label>
        <select class="forge-profile"><option value="">(none)</option></select>
      </div>
      <p class="forge-help forge-fixed-style">Game style: DEAD MALL</p>
      <div class="forge-row forge-competition-options">
        <label>Review</label>
        <select class="forge-rounds">
          <option value="0">0 – draft only (fast)</option>
          <option value="1">1 round</option>
          <option value="2" selected>2 rounds</option>
          <option value="3">3 rounds (best)</option>
        </select>
      </div>
      <div class="forge-row forge-competition-options">
        <label>Drafts</label>
        <select class="forge-candidates">
          <option value="1">1 (fastest)</option>
          <option value="3" selected>3, judge picks best</option>
          <option value="4">4</option>
        </select>
      </div>
      <div class="forge-row forge-competition-options">
        <label>Artist</label>
        <select class="forge-artist"></select>
      </div>
      <div class="forge-row forge-competition-options">
        <label>Model</label>
        <select class="forge-model">
          <option value="">default</option>
          <option value="opus">Opus</option>
          <option value="sonnet">Sonnet</option>
          <option value="fable">Fable</option>
        </select>
      </div>
      <p class="forge-help forge-model-help forge-competition-options">Model names apply to Claude; leave "default" for GPT.</p>
      <div class="forge-row forge-competition-options">
        <label>Result</label>
        <select class="forge-target">
          <option value="new">Open as new sprite</option>
          <option value="layer">Add as new layer</option>
        </select>
      </div>
      <button type="button" class="button button-primary forge-generate">Generate</button>
      <div class="forge-workflow-status" aria-live="polite"></div>
      <div class="forge-workflow-previews"></div>
      <div class="forge-review-sheet"></div>
      <button type="button" class="button forge-workflow-open hidden">Open final as new sprite</button>
      <button type="button" class="button forge-workflow-cancel hidden">Cancel generation</button>
      <button type="button" class="button forge-workflow-retry hidden">Retry this request</button>
    </div>

    <!-- REFINE -->
    <div class="settings-item forge-pane hidden" data-forge-pane="refine">
      <p class="forge-help">The artist looks at the current frame and changes it. The result is added as a new layer, so your original stays intact.</p>
      <textarea class="textfield forge-refine-prompt" rows="3"
        placeholder="e.g. make the cord more frayed, add a coin slot, darker shadows on the right"></textarea>
      <button type="button" class="button button-primary forge-refine">Refine current frame</button>
    </div>

    <!-- PIXELIZE -->
    <div class="settings-item forge-pane hidden" data-forge-pane="pixelize">
      <p class="forge-help">Turn any image (AI output, photo, sketch, blurry upscale) into real pixel art. Uses the image you pick, or the current frame.</p>
      <input type="file" class="forge-file" accept="image/*"/>
      <div class="forge-row">
        <label>Conversion</label>
        <select class="forge-px-preset">
          <option value="standard">Standard pixel cleanup</option>
          <option value="illustration">GPT image / illustration</option>
        </select>
      </div>
      <p class="forge-help">For detailed images, use GPT image / illustration to keep highlights, reduce speckle and clean outlines while shrinking. Small details may still need a redraw at game size.</p>
      <div class="forge-row">
        <label>Size</label>
        <input type="number" class="textfield forge-px-w" min="4" max="256" placeholder="auto"/>
        <span>×</span>
        <input type="number" class="textfield forge-px-h" min="4" max="256" placeholder="auto"/>
      </div>
      <div class="forge-row">
        <label>Colours</label>
        <input type="number" class="textfield forge-px-colors" min="2" max="64" value="16"/>
      </div>
      <label class="checkbox-container"><input type="checkbox" class="forge-px-palette"/> <span>Snap to style palette</span></label>
      <label class="checkbox-container"><input type="checkbox" class="forge-px-grid" checked/> <span>Detect fake pixel grid</span></label>
      <label class="checkbox-container"><input type="checkbox" class="forge-px-bg" checked/> <span>Remove background</span></label>
      <label class="checkbox-container"><input type="checkbox" class="forge-px-orphans"/> <span>Remove stray pixels</span></label>
      <button type="button" class="button button-primary forge-pixelize">Pixelize</button>
    </div>

    <!-- LIBRARY -->
    <div class="settings-item forge-pane hidden" data-forge-pane="library">
      <div class="forge-row">
        <label>Project</label>
        <select class="forge-project"><option value="">(choose)</option></select>
      </div>
      <div class="forge-row">
        <input type="text" class="textfield forge-project-path" placeholder="/path/to/game/assets"/>
        <button type="button" class="button forge-project-add">Add</button>
      </div>
      <button type="button" class="button forge-learn">Learn style from this project</button>
      <input type="text" class="textfield forge-asset-filter" placeholder="filter, e.g. props"/>
      <div class="forge-assets"></div>
      <div class="settings-title forge-subtitle">Forge library</div>
      <div class="forge-library"></div>
    </div>

    <div class="forge-results"></div>
    <pre class="forge-log"></pre>
  </div>
</script>
